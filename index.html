<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Caio Carregado Awards 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: piada interna, escrachado, edit de Instagram de futebol feito às pressas
   IDEA: o card de ranking "Ballon d'Or" que circula no grupo
   PICTURE: Bola de Ouro em CSS + cada categoria com seu enfeite em código (chifre, crachá...)
   COLOUR and TYPE: preto + laranja da faixa + dourado, cards vermelho/azul; Anton + Barlow Condensed itálico
   LAYOUT: faixa laranja no topo, uma coluna no celular, cards largos e tortos */
:root{color-scheme:dark;--bg:#0b0b0b;--ink:#fff;--lar:#f4a23a;--ouro:#f2c94c;--cinza:#9a9a9a;--verm:#d0101c;--azul:#1a6fd0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(circle,#3a2c08 1.2px,transparent 1.6px) 0 0/22px 22px;color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
a{color:inherit}
button,input,select{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 max(4vw,14px) 60px}
/* topo */
.topo{background:var(--lar);color:#fff;font:400 clamp(17px,3.4vw,24px)/1 Anton,Impact,sans-serif;letter-spacing:.02em;padding:14px max(4vw,14px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;text-shadow:2px 2px 0 #b5650f;border-bottom:4px solid #000}
.topo b{font-weight:400}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{font:800 15px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;text-decoration:none;background:#000;color:#fff;padding:10px 12px;text-shadow:none;transform:skew(-8deg);display:inline-block}
nav a.on{background:#fff;color:#000}
.listras{height:10px;background:repeating-linear-gradient(-45deg,var(--lar) 0 8px,transparent 8px 14px);margin:14px 0 0 auto;width:min(260px,50%)}
/* hero */

.hero h1{font:400 clamp(44px,9vw,92px)/.9 Anton,Impact,sans-serif;margin:0;text-transform:uppercase;transform:rotate(-2deg);text-shadow:4px 4px 0 var(--verm),8px 8px 0 #000}
.hero h1 span{color:var(--ouro);display:block;font-size:.62em}
.hero p{font:800 italic 20px/1.2 'Barlow Condensed',sans-serif;color:var(--cinza);margin:18px 0 0;text-transform:uppercase}
.contagem{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.contagem div{background:#fff;color:#000;padding:8px 10px 6px;min-width:66px;text-align:center;transform:rotate(-1.5deg);border:3px solid #000;box-shadow:4px 4px 0 var(--lar)}
.contagem div:nth-child(even){transform:rotate(2deg)}
.contagem b{display:block;font:400 34px/1 Anton,sans-serif}
.contagem small{font:800 12px/1 'Barlow Condensed',sans-serif;text-transform:uppercase}

/* bola de ouro */
.trofeu{display:inline-flex;flex-direction:column;align-items:center;flex:none}
.bola{width:56px;height:56px;border-radius:50%;position:relative;background:radial-gradient(circle at 34% 28%,#fffbe0 0,#ffe27a 18%,#e0a92a 48%,#8a5d07 82%,#4a3100 100%);box-shadow:inset -4px -6px 10px #0006}
.bola::before{content:"";position:absolute;inset:30% 32%;background:#a8770f;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);opacity:.75}
.bola::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 18deg,transparent 0 66deg,#7a520666 66deg 72deg)}
.base{width:46px;height:20px;margin-top:-4px;background:linear-gradient(90deg,#666,#eee 35%,#999 60%,#ddd);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);border-bottom:4px solid #c9a03a}
/* cards de categoria */
h2{font:400 clamp(28px,5vw,40px)/1.05 Anton,sans-serif;text-transform:uppercase;margin:42px 0 18px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:22px}
.cat{display:block;text-decoration:none;background:linear-gradient(120deg,#1c1c1c,#000);border:3px solid #fff;padding:46px 18px 18px;position:relative;box-shadow:6px 6px 0 var(--lar);transition:transform .15s}
.cat:nth-child(odd){transform:rotate(-1deg)}.cat:nth-child(even){transform:rotate(1.2deg)}
.cat:hover,.cat:focus-visible{transform:rotate(0) scale(1.02);outline:none}
.cat small{font:800 13px/1 'Barlow Condensed',sans-serif;color:var(--cinza);text-transform:uppercase}
.cat p{margin:8px 0 0;color:#ccc}
.selo{position:absolute;top:10px;right:10px;font:800 12px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;background:var(--verm);padding:5px 7px;transform:rotate(4deg)}
.selo.ok{background:#2b8a3e}
.nome{font:400 34px/1 Anton,sans-serif;text-transform:uppercase;position:relative;display:inline-block;margin:6px 0 4px}
.grande .nome{font-size:clamp(42px,9vw,72px)}
/* enfeite: chifre */
.d-chifre .ch{position:absolute;top:-.78em;width:.5em;height:.92em;background:repeating-linear-gradient(0deg,#f6eed9 0 3px,#cdb98d 3px 5px);clip-path:polygon(45% 0,62% 14%,80% 45%,100% 100%,15% 100%,24% 55%,32% 22%)}
.d-chifre .ch.l{left:.12em;transform:rotate(-24deg)}
.d-chifre .ch.r{right:.12em;transform:scaleX(-1) rotate(-24deg)}
/* enfeite: crachá */
.d-cracha .cr{position:absolute;right:-.15em;top:-1.15em;width:1.25em;height:.8em;background:#fff;border-radius:3px;transform:rotate(9deg);box-shadow:2px 3px 0 #000;font-size:.62em;overflow:hidden}
.d-cracha .cr::before{content:"CLT";display:block;background:var(--azul);color:#fff;font:400 .26em/1.5 Anton,sans-serif;text-align:center}
.d-cracha .cr i{position:absolute;left:8%;top:38%;width:24%;height:46%;background:#bbb}
.d-cracha .cr b{position:absolute;left:38%;right:8%;top:44%;height:4px;background:#bbb;box-shadow:0 7px 0 #ddd}
.d-cracha .fita{position:absolute;right:.25em;top:-1.6em;width:.5em;height:.55em;border:3px solid var(--azul);border-bottom:0;border-radius:50% 50% 0 0;transform:rotate(9deg)}
.d-cracha .ponto{position:absolute;left:0;top:-2.6em;font:800 .28em/1 'Barlow Condensed',sans-serif;color:var(--verm);border:2px solid var(--verm);padding:2px 5px;transform:rotate(-8deg);background:#000c;white-space:nowrap}
/* enfeite: sumido */
.d-sumido .l{display:inline-block;white-space:pre}
.d-sumido .visto{display:block;width:max-content;font:500 .3em/1 Barlow,sans-serif;text-transform:none;color:#aaa;background:#222;border:1px dashed #555;border-radius:20px;padding:4px 9px;margin-top:6px}
/* enfeite: bola */
.d-ball .trofeu{position:absolute;right:-1.1em;top:-.9em;transform:scale(.5) rotate(12deg);transform-origin:top right}

/* enfeites das categorias (tudo em CSS) */
.nome i,.nome b{font-style:normal}
.d-coroa .coroa{position:absolute;left:.05em;top:-.55em;width:.75em;height:.48em;background:linear-gradient(#ffe27a,#c8901a);clip-path:polygon(0 100%,0 18%,25% 58%,50% 0,75% 58%,100% 18%,100% 100%);transform:rotate(-14deg);filter:drop-shadow(2px 2px 0 #000)}
.d-vermelho .cv{position:absolute;right:-.45em;top:-.62em;width:.36em;height:.52em;background:#e01e25;border-radius:3px;transform:rotate(16deg);box-shadow:3px 3px 0 #000}
.d-miss{padding-bottom:.42em}
.d-miss .faixa{position:absolute;left:-.15em;right:-.15em;bottom:0;background:linear-gradient(90deg,#ff5fa2,#ffb3d1,#ff5fa2);color:#7a0040;font:400 .24em/1.6 Anton,sans-serif;text-align:center;transform:rotate(-4deg);letter-spacing:.2em;box-shadow:2px 3px 0 #000}
.d-brilho .br{position:absolute;width:.32em;height:.32em;background:#fff6b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:pisca 1.4s infinite}
.b1{left:-.2em;top:-.35em}.b2{right:-.25em;top:-.2em;animation-delay:.5s!important;transform:scale(.7)}.b3{left:45%;top:-.45em;animation-delay:.9s!important;transform:scale(.55)}
@keyframes pisca{50%{opacity:.15}}
.d-arcoiris .arco-iris{position:absolute;left:0;right:0;bottom:-.14em;height:.14em;background:linear-gradient(90deg,#e40303 0 16%,#ff8c00 0 33%,#ffed00 0 50%,#008026 0 66%,#004dff 0 83%,#750787 0)}
.d-piada .balao{position:absolute;right:-.3em;top:-3.6em;background:#fff;color:#000;font:800 .3em/1 'Barlow Condensed',sans-serif;padding:5px 9px;border-radius:12px;transform:rotate(6deg);box-shadow:3px 3px 0 #000}
.d-piada .balao::after{content:"";position:absolute;left:18%;bottom:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.d-controle .ctrl{position:absolute;right:-.75em;top:-.72em;width:.95em;height:.5em;background:#2b2b2b;border:3px solid #fff;border-radius:.25em;transform:rotate(12deg)}
.d-controle .ctrl::before{content:"";position:absolute;left:12%;top:28%;width:.18em;height:.18em;background:linear-gradient(#fff,#fff) center/100% 32% no-repeat,linear-gradient(#fff,#fff) center/32% 100% no-repeat}
.d-controle .ctrl b{position:absolute;right:12%;top:26%;width:.07em;height:.07em;border-radius:50%;background:#e01e25;box-shadow:.1em .06em 0 #1f7ae0,.03em .14em 0 #ffd400}
.d-file .bife{position:absolute;right:-.62em;top:-.62em;width:.8em;height:.55em;background:repeating-linear-gradient(40deg,#8b3a1a 0 .1em,#2a0e04 .1em .14em);border:.06em solid #f6dcc0;border-radius:52% 40% 58% 45%;transform:rotate(-10deg);box-shadow:3px 3px 0 #000}
.d-termino .cor{position:absolute;right:-.7em;top:-.62em;width:.62em;height:.56em}
.d-termino .h{position:absolute;inset:0;background:#e01e25}
.d-termino .h.l{clip-path:polygon(50% 25%,39% 8%,22% 3%,7% 12%,0 30%,5% 50%,50% 100%,44% 80%,54% 62%,44% 45%,54% 33%);transform:translateX(-.06em) rotate(-12deg)}
.d-termino .h.r{clip-path:polygon(50% 25%,61% 8%,78% 3%,93% 12%,100% 30%,95% 50%,50% 100%,44% 80%,54% 62%,44% 45%,54% 33%);transform:translateX(.06em) rotate(12deg)}
.d-sentida .gota{position:absolute;bottom:-.2em;width:.13em;height:.13em;background:#5ab4ff;border-radius:0 50% 50% 50%;transform:rotate(45deg);animation:cai 1.8s infinite ease-in}
.g1{left:18%}.g2{left:52%;animation-delay:.6s!important}.g3{left:80%;animation-delay:1.2s!important}
@keyframes cai{0%{opacity:0;translate:0 -.3em}20%{opacity:1}100%{opacity:0;translate:0 .5em}}
.d-print .mira{position:absolute;inset:-.18em -.22em;background:linear-gradient(#fff,#fff) 0 0/.3em .05em,linear-gradient(#fff,#fff) 0 0/.05em .3em,linear-gradient(#fff,#fff) 100% 0/.3em .05em,linear-gradient(#fff,#fff) 100% 0/.05em .3em,linear-gradient(#fff,#fff) 0 100%/.3em .05em,linear-gradient(#fff,#fff) 0 100%/.05em .3em,linear-gradient(#fff,#fff) 100% 100%/.3em .05em,linear-gradient(#fff,#fff) 100% 100%/.05em .3em;background-repeat:no-repeat}
.d-edit{background:linear-gradient(90deg,#7ab8ff,#c58bff,#ff7ac3,#7ab8ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilha 4s linear infinite}
@keyframes brilha{to{background-position:200% 0}}
.d-edit .pw{display:block;width:max-content;max-width:100%;font:800 .26em/1.3 'Barlow Condensed',sans-serif;color:#000;background:#fff;padding:3px 8px;margin-top:6px;transform:rotate(-2deg)}
.d-arco{padding-top:.25em}
.d-arco .arc{position:absolute;left:.1em;right:.1em;top:-.5em;height:.7em;border:.05em dashed var(--ouro);border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.d-arco .ep{position:absolute;top:.02em;font:800 .22em/1 'Barlow Condensed',sans-serif;color:var(--ouro)}
.e1{left:0}.e2{right:0}
.d-aspas::before,.d-aspas::after{font:400 1.3em/0 Georgia,serif;color:var(--ouro);vertical-align:-.45em}
.d-aspas::before{content:"\201C";margin-right:.05em}.d-aspas::after{content:"\201D";margin-left:.05em}
.d-video .play{position:absolute;right:-.7em;top:-.66em;width:.55em;height:.55em;border-radius:50%;background:#e01e25;box-shadow:3px 3px 0 #000}
.d-video .play::after{content:"";position:absolute;left:38%;top:28%;border:.12em solid transparent;border-left:.19em solid #fff;border-right:0}
.d-video .rec{position:absolute;left:0;top:-2.2em;font:800 .26em/1 'Barlow Condensed',sans-serif;color:#ff4d4d;animation:pisca 1s infinite}
.d-video .rec::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#ff4d4d;margin-right:4px}
.selo.nova{background:var(--azul)}
.cat .nome{font-size:30px;margin-top:10px}
/* votação */
.voltar{display:inline-block;margin-top:26px;font:800 15px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;text-decoration:none;color:var(--cinza)}
.titcat{padding:38px 0 6px}
.titcat p{color:#ccc;margin:6px 0 0;font-size:18px}
.opcoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px;margin-top:22px}
.op{display:flex;align-items:center;gap:12px;text-align:left;background:#161616;color:#fff;border:3px solid #333;padding:12px;cursor:pointer;min-height:64px;font:400 22px/1 Anton,sans-serif;text-transform:uppercase}
.op:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.op[aria-pressed=true]{border-color:var(--ouro);background:#2a2208;box-shadow:5px 5px 0 var(--ouro);transform:rotate(-1deg)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 18px/1 Anton,sans-serif;border:3px solid #fff}
.op.print{flex-direction:column;align-items:stretch;font-size:16px}
.tela{background:#0d1418;border-radius:10px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.tela img{width:100%;border-radius:6px;display:block}
.msg{font:500 14px/1.3 Barlow,sans-serif;text-transform:none;background:#1f2c33;padding:6px 9px;border-radius:8px;max-width:85%}
.msg.eu{background:#005c4b;align-self:flex-end}
.ex{font:500 12px/1 Barlow,sans-serif;color:#777;text-transform:none}
.btn{display:inline-block;background:var(--lar);color:#000;border:3px solid #000;box-shadow:5px 5px 0 #fff;font:400 22px/1 Anton,sans-serif;text-transform:uppercase;padding:14px 22px;cursor:pointer;margin-top:24px;transform:skew(-6deg)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:#fff;box-shadow:4px 4px 0 var(--lar);font-size:16px;padding:10px 14px;margin-top:0}
.btn.nao{background:#333;color:#fff}

.cat{cursor:default}
.cab{all:unset;display:block;width:100%;cursor:pointer}
.cab:focus-visible{outline:3px solid var(--ouro);outline-offset:4px}
.seta{display:block;margin-top:12px;font:800 15px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--lar)}
.indicados{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:2px dashed #444}
.indicados[hidden]{display:none}
.indicados figure{margin:0;text-align:center}
.indicados figcaption{font:800 13px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin-top:5px}
.foto{display:block;aspect-ratio:1;border-radius:50%;border:3px solid #fff;background-size:cover;background-position:center 30%;box-shadow:3px 3px 0 var(--lar)}
.op.pessoa{flex-direction:column;align-items:center;text-align:center;font-size:18px;gap:10px;padding:14px 10px}
.op.pessoa .foto{width:min(110px,100%)}
.opcoes:has(.pessoa){grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr))}
.prog{margin-top:26px;font:800 14px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--cinza)}
.prog i{display:block;height:8px;background:var(--lar);margin-top:8px;transform:skew(-12deg);transition:width .3s}
.final{font:800 italic 18px/1 'Barlow Condensed',sans-serif;color:var(--ouro);text-transform:uppercase;margin:22px 0 -10px}
.passos{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:26px}
.passos .btn{margin-top:0}
a.btn{text-decoration:none}
@media(max-width:420px){.indicados{grid-template-columns:repeat(3,minmax(0,1fr))}}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 0 10px}
.hero .trofeu{transform:scale(1.7);margin:34px 0 46px}
.hero .contagem{justify-content:center}
.hero > .btn{margin-top:30px}
.trava{position:relative;display:inline-grid;place-items:center;width:min(340px,92vw);height:130px;margin-top:30px}
.trava .btn{margin:0;opacity:.55;cursor:not-allowed}
.corr{position:absolute;left:50%;top:50%;height:14px;transform-origin:0 50%;background:radial-gradient(ellipse 45% 38% at 50% 50%,transparent 52%,#d9d9d9 56% 78%,transparent 82%) 0 0/22px 100% repeat-x,linear-gradient(#8f8f8f,#8f8f8f) 11px 50%/10px 4px repeat-x;filter:drop-shadow(2px 2px 0 #000)}
.paraf{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#888);border:2px solid #000}
.p1{left:-7px;top:-7px}.p2{right:-7px;top:-7px}.p3{left:-7px;bottom:-7px}.p4{right:-7px;bottom:-7px}
.cadeado{position:absolute;left:50%;top:50%;width:46px;height:40px;transform:translate(-50%,-30%) rotate(-6deg);background:linear-gradient(135deg,#ffe27a,#d39b1f 55%,#8a5d07);border:3px solid #000;border-radius:7px;box-shadow:3px 3px 0 #000}
.cadeado::before{content:"";position:absolute;left:50%;bottom:100%;width:28px;height:24px;transform:translateX(-50%);border:6px solid #cfcfcf;border-bottom:0;border-radius:16px 16px 0 0;margin-bottom:-2px}
.cadeado b{position:absolute;left:50%;top:9px;width:9px;height:9px;border-radius:50%;background:#000;transform:translateX(-50%)}
.cadeado b::after{content:"";position:absolute;left:3px;top:6px;width:3px;height:10px;background:#000}
.emb{font:800 italic 15px/1 'Barlow Condensed',sans-serif;color:var(--cinza);text-transform:uppercase;margin:16px 0 0}
.indicados{grid-template-columns:repeat(2,minmax(0,1fr))}
.indicados img{width:100%;display:block;border:3px solid #fff}
.indicados.poster{grid-template-columns:1fr}
.indicados.poster img{border:0}
.op.pessoa img{width:100%;display:block;border:2px solid #fff}
.opcoes:has(.pessoa){grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
@media(max-width:420px){.indicados{grid-template-columns:repeat(2,minmax(0,1fr))}}
.palco{display:grid;place-items:center;margin-top:6px}.palco>*{grid-area:1/1}
.mascote{width:min(300px,72vw);display:block;filter:drop-shadow(0 10px 24px #f2a5204d);transform:rotate(-4deg)}
.palco h1{position:relative;align-self:end;margin-bottom:9%}
/* overlay */
.ov{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:20px;z-index:9}
.ov[hidden]{display:none}
.ov div{background:#fff;color:#000;border:4px solid #000;box-shadow:10px 10px 0 var(--lar);padding:30px 26px;text-align:center;max-width:380px;transform:rotate(-2deg)}
.ov h3{font:400 40px/1 Anton,sans-serif;text-transform:uppercase;margin:14px 0 6px}
.ov p{margin:0}
/* enviar */
.form{max-width:560px;display:grid;gap:16px;margin-top:20px}
label{font:800 15px/1.2 'Barlow Condensed',sans-serif;text-transform:uppercase;display:grid;gap:6px}
select,input[type=text],input[type=password]{font-size:16px;padding:12px;background:#111;color:#fff;border:3px solid #fff;min-height:48px}
.drop{border:3px dashed var(--lar);padding:26px 16px;text-align:center;cursor:pointer;background:#140f05;font:400 22px/1.1 Anton,sans-serif;text-transform:uppercase}
.drop small{display:block;font:500 14px Barlow,sans-serif;text-transform:none;color:#aaa;margin-top:6px}
.drop img{max-width:200px;max-height:260px;display:block;margin:0 auto 10px;border:3px solid #fff}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
/* painel */
.bloco{background:#141414;border:3px solid #fff;padding:18px;margin-top:20px}
.bloco h3{font:400 24px/1 Anton,sans-serif;text-transform:uppercase;margin:0 0 14px}
.pend{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid #333}
.pend .tela{min-height:90px;padding:6px}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.barra{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3em;gap:10px;align-items:center;margin:6px 0;font-weight:700}
.barra i{display:block;height:16px;background:var(--lar);transform:skew(-10deg)}
.barra span:last-child{text-align:right}
.vazio{color:#888;margin:0}
/* resultados no estilo do card */
.rk-tit{background:var(--lar);font:400 clamp(16px,3.5vw,24px)/1.2 Anton,sans-serif;text-transform:uppercase;padding:12px 18px;margin:44px 0 14px;width:fit-content;max-width:100%;box-shadow:5px 5px 0 #000}
.rk{display:grid;grid-template-columns:2.6em minmax(0,1fr);height:clamp(92px,15vw,130px);margin-bottom:12px;border:2px solid #222}
.rk .lado{background:#f2f2f2;color:#000;writing-mode:vertical-rl;transform:rotate(180deg);font:400 clamp(11px,2vw,15px)/1 Anton,sans-serif;text-transform:uppercase;display:grid;place-items:center;overflow:hidden;white-space:nowrap}
.rk .meio{position:relative;display:flex;align-items:center;gap:clamp(8px,2vw,20px);padding:0 clamp(8px,2vw,22px);overflow:hidden}
.esc{position:absolute;left:-1.2em;top:50%;width:clamp(90px,16vw,150px);aspect-ratio:.85;transform:translateY(-50%);border-radius:10% 10% 50% 50%;opacity:.55;border:6px solid #0004}
.rk .av2{position:relative;width:clamp(56px,10vw,86px);height:clamp(56px,10vw,86px);border-radius:50%;border:4px solid #fff;display:grid;place-items:center;font:400 clamp(20px,4vw,32px)/1 Anton,sans-serif;margin-left:clamp(40px,10vw,110px);flex:none;overflow:hidden;box-shadow:0 6px 0 #0006;background-size:cover;background-position:center}
.rk .rot{margin-left:auto;font:800 italic clamp(20px,5vw,40px)/1 'Barlow Condensed',sans-serif;color:#bdbdbd;text-shadow:2px 2px 0 #0007}
.rk .num{font:400 clamp(48px,11vw,92px)/1 Anton,sans-serif;text-shadow:3px 3px 0 #0008}
.rk .trofeu{transform:scale(.85)}
.rk .votos{position:absolute;right:8px;bottom:4px;font:700 11px Barlow,sans-serif;color:#fffa}
.c0{background:linear-gradient(90deg,#c30d17,#5a0007 60%,#000)}
.c1{background:linear-gradient(90deg,#c9141c,#e01e25)}
.c2{background:linear-gradient(90deg,#0f5cbf,#1f7ae0)}
.c3{background:linear-gradient(180deg,#b5470f,#5aa0e8)}
.c4{background:linear-gradient(180deg,#e9e9e9,#222)}
.trancado{text-align:center;padding:40px 18px;border:3px dashed #555;margin-top:24px}
.trancado h3{font:400 clamp(30px,6vw,48px)/1 Anton,sans-serif;text-transform:uppercase;margin:20px 0 8px}
.aviso{font-size:13px;color:#777;margin-top:30px}
@media(max-width:640px){.pend{grid-template-columns:90px minmax(0,1fr)}.rk .rot{display:none}.rk .av2{margin-left:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  let d = Math.max(0, DATA_PREMIACAO - Date.now()) / 1000;
  const p = [Math.floor(d / 86400), Math.floor(d % 86400 / 3600), Math.floor(d % 3600 / 60), Math.floor(d % 60)];
  return '<div class="contagem">' + p.map((v, i) => '<div><b>' + String(v).padStart(2, '0') + '</b><small>' + ['dias','horas','min','seg'][i] + '</small></div>').join('') + '</div>';
}

const V = {
  inicio() {
    return '<section class="hero"><div class="palco"><img class="mascote" src="' + TROFEU + '" alt=""><h1>Caio Carregado <span>Awards 2026</span></h1></div><p>Revelação dia 10 de dezembro</p><div id="cont">' + contagem() + '</div>' + botaoVotar() + '</section><div class="listras"></div>' +
      '<h2>Os indicados</h2><div class="cats">' + S.cats.map(c => {
        const sel = c.nova ? '<span class="selo nova">Nova</span>' : c.tipo === 'prints' ? '<span class="selo">Com print</span>' : '';
        if (c.tipo === 'nomes') return '<div class="cat" data-abre="' + c.id + '">' + sel + '<button class="cab" aria-expanded="false" aria-controls="ind-' + c.id + '">' + nomeDeco(c) + '<span class="seta">Ver indicados</span></button><div class="indicados' + (c.id === 'membro' ? ' poster' : '') + '" id="ind-' + c.id + '" hidden>' + (c.id === 'membro' ? '<img src="' + POSTER + '" alt="Os 5 membros do grupo">' : opcoes(c).map(o => '<figure><img src="' + o.foto + '" alt=""><figcaption>' + esc(o.nome) + '</figcaption></figure>').join('')) + '</div></div>';
        return '<a class="cat" href="#ver-' + c.id + '">' + sel + nomeDeco(c) + '<span class="seta">Ver todos →</span></a>';
      }).join('') + '</div><div style="text-align:center;margin-top:30px">' + botaoVotar() + '</div>' +
      '<p class="aviso">Protótipo: os indicados de cada categoria ainda são os 5 membros de exemplo, e os votos ficam só neste aparelho.</p>';
  },
  ver(id) {
    const c = S.cats.find(x => x.id === id); if (!c) return V.inicio();
    const ops = opcoes(c);
    return '<a class="voltar" href="#inicio">← Início</a><section class="titcat grande">' + nomeDeco(c) + '</section>' +
      (ops.length ? '<div class="opcoes">' + ops.map(o => cartao(o, false)).join('') + '</div>' : '<p class="vazio">Nada aprovado ainda nessa categoria.</p>') +
      '<div style="text-align:center">' + botaoVotar() + '</div>';
  },
  votacao() {
    const ordem = ORDEM(), c = ordem[W.i], ops = opcoes(c), esc1 = W.escolhas[c.id];
    return '<div class="prog"><span>Categoria ' + (W.i + 1) + ' de ' + ordem.length + '</span><i style="width:' + ((W.i + 1) / ordem.length * 100) + '%"></i></div>' +
      (c.id === 'membro' ? '<p class="final">A última e a mais importante</p>' : '') +
      '<section class="titcat grande">' + nomeDeco(c) + '</section>' +
      (ops.length ? '<div class="opcoes">' + ops.map(o => cartao(o, true, esc1 === o.id)).join('') + '</div>' : '<p class="vazio">Nada aprovado ainda nessa categoria. Pode seguir.</p>') +
      '<div class="passos">' + (W.i > 0 ? '<button class="btn sec" id="ant">← Anterior</button>' : '<a class="btn sec" href="#inicio">Sair</a>') +
      '<button class="btn" id="prox"' + (ops.length && !esc1 ? ' disabled' : '') + '>' + (W.i === ordem.length - 1 ? 'Enviar meus votos' : 'Próxima →') + '</button></div>';
  },
  enviar() {
    const pc = S.cats.filter(c => c.tipo === 'prints');
    return '<h2>Manda o print ou vídeo</h2><p>Escolhe a categoria e sobe o arquivo. A comissão analisa antes de entrar na votação.</p><form class="form" id="fenv">' +
      '<label>Categoria<select id="ecat">' + pc.map(c => '<option value="' + c.id + '">' + esc(c.nome) + '</option>').join('') + '</select></label>' +
      '<label class="drop" for="efile" id="drop">Toca aqui pra escolher o arquivo<small>Print, edit ou vídeo, direto da galeria</small></label><input type="file" id="efile" accept="image/*,video/*">' +
      '<button class="btn" id="ebtn" disabled>Enviar print</button></form>';
  },
  painel() {
    if (!S.logado) return '<h2>Painel da comissão</h2><form class="form" id="flog"><label>Senha<input type="password" id="senha" autocomplete="current-password"></label><p class="vazio" id="erro"></p><button class="btn">Entrar</button><p class="aviso">Senha do protótipo: cc2026</p></form>';
    const pend = S.prints.filter(p => p.status === 'pend');
    return '<h2>Painel da comissão</h2>' +
      '<div class="bloco"><h3>Prints pra aprovar (' + pend.length + ')</h3>' + (pend.length ? pend.map(p => '<div class="pend">' + telaHTML(p) + '<div><b>' + esc(S.cats.find(c => c.id === p.cat)?.nome || '') + '</b><div class="acoes"><button class="btn sec" data-ap="' + p.id + '">Aprovar</button><button class="btn sec nao" data-rc="' + p.id + '">Recusar</button></div></div></div>').join('') : '<p class="vazio">Nada na fila.</p>') + '</div>' +
      '<div class="bloco"><h3>Parcial (só vocês veem)</h3>' + S.cats.map(c => { const v = S.votos[c.id] || {}, ops = opcoes(c), max = Math.max(1, ...ops.map(o => v[o.id] || 0)); return '<p><b>' + esc(c.nome) + '</b></p>' + ops.map(o => '<div class="barra"><span>' + esc(o.nome) + '</span><i style="width:' + ((v[o.id] || 0) / max * 100) + '%"></i><span>' + (v[o.id] || 0) + '</span></div>').join(''); }).join('') + '</div>' +
      '<div class="bloco"><h3>Votação</h3><p>' + (S.aberta ? 'Votação aberta.' : 'Votação fechada, com o botão acorrentado.') + '</p><button class="btn sec" id="abre">' + (S.aberta ? 'Fechar votação' : 'Abrir votação') + '</button></div>' +
      '<div class="bloco"><h3>Revelação</h3><p>' + (S.liberado ? 'Resultados liberados pra todo mundo.' : 'Resultados escondidos até vocês liberarem.') + '</p><button class="btn sec" id="lib">' + (S.liberado ? 'Esconder resultados' : 'Liberar resultados') + '</button></div>' +
      '<div class="bloco"><h3>Nova categoria</h3><form class="form" id="fcat" style="margin:0"><label>Nome<input type="text" id="cnome" maxlength="30" required></label><label>Frase<input type="text" id="csub" maxlength="60"></label><label>Tipo<select id="ctipo"><option value="nomes">Votar em nomes</option><option value="prints">Votar em prints ou vídeos</option><option value="texto">Votar em opções escritas</option></select></label><button class="btn sec">Criar categoria</button></form><p class="aviso">Categoria criada aqui entra sem enfeite. O enfeite eu desenho no código.</p></div>';
  },
  resultados() {
    if (!S.liberado) return '<section class="trancado">' + trofeu + '<h3>Resultado trancado</h3><p>A revelação é dia 10 de dezembro.</p><div style="display:flex;justify-content:center" id="cont">' + contagem() + '</div></section>';
    return S.cats.map(c => {
      const v = S.votos[c.id] || {};
      const top = opcoes(c).map(o => ({...o, n:v[o.id] || 0})).sort((a, b) => b.n - a.n).slice(0, 5);
      return '<div class="rk-tit">CC Awards 2026 - ' + esc(c.nome) + ' - Ranking</div>' + top.map((o, i) =>
        '<div class="rk"><div class="lado">' + esc(o.nome) + '</div><div class="meio c' + i + '"><i class="esc" style="background:repeating-linear-gradient(90deg,' + (o.cor || '#f4a23a') + ' 0 14px,#000 14px 26px)"></i>' +
        '<span class="av2" style="' + (o.foto ? 'background-image:url(' + o.foto + ');background-position:58% 20%' : o.print?.img ? 'background-image:url(' + o.print.img + ')' : 'background:' + (o.cor || '#222')) + '">' + (o.foto ? '' : o.print ? (o.print.img ? '' : '#' + o.nome.split('#')[1]) : o.ex ? o.nome.slice(-1) : ini(o.nome)) + '</span>' +
        '<span class="rot">RANK</span><span class="num">' + (i + 1) + '</span>' + trofeu + '<span class="votos">' + o.n + ' votos</span></div></div>').join('');
    }).join('') + '';
  }
};

let arquivo = null, timer = null;
function render() {
  const h = location.hash.slice(1) || 'inicio';
  const [v, id] = h.startsWith('ver-') ? ['ver', h.slice(4)] : [h, null];
  if (v === 'votacao' && !S.aberta) { location.hash = 'inicio'; return; }
  if (v === 'votacao' && W.i >= ORDEM().length) W.i = 0;
  app.innerHTML = (V[v] || V.inicio)(id);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + (v === 'ver' || v === 'votacao' ? 'inicio' : v)));
  clearInterval(timer);
  if (document.getElementById('cont')) timer = setInterval(() => { const el = document.getElementById('cont'); if (el) el.innerHTML = contagem(); }, 1000);
  correntes();
  window.scrollTo(0, 0);
}

function aviso(t, p, alvo) {
  document.getElementById('ovt').textContent = t;
  document.getElementById('ovp').textContent = p;
  const ov = document.getElementById('ov'); ov.hidden = false;
  document.getElementById('ovb').onclick = () => { ov.hidden = true; location.hash = alvo; render(); };
  document.getElementById('ovb').focus();
}

app.addEventListener('click', e => {
  const cab = e.target.closest('.cab');
  if (cab) { const p = document.getElementById(cab.getAttribute('aria-controls')), abrir = p.hidden; p.hidden = !abrir; cab.setAttribute('aria-expanded', abrir); cab.querySelector('.seta').textContent = abrir ? 'Fechar' : 'Ver indicados'; return; }
  const op = e.target.closest('[data-op]');
  if (op) { const c = ORDEM()[W.i]; W.escolhas[c.id] = op.dataset.op; app.querySelectorAll('[data-op]').forEach(b => b.setAttribute('aria-pressed', b === op)); document.getElementById('prox').disabled = false; return; }
  if (e.target.id === 'ant') { W.i--; render(); return; }
  if (e.target.id === 'prox') {
    if (W.i < ORDEM().length - 1) { W.i++; render(); return; }
    // bloqueio silencioso: se este aparelho já votou, não conta, mas a mensagem é a mesma
    if (!S.jaVotou) { for (const [cat, op] of Object.entries(W.escolhas)) S.votos[cat][op] = (S.votos[cat][op] || 0) + 1; S.jaVotou = true; }
    W.i = 0; W.escolhas = {};
    aviso('Votos registrados.', 'Valeu. Agora é esperar a revelação dia 10 de dezembro.', 'inicio'); return;
  }
  const ap = e.target.closest('[data-ap],[data-rc]');
  if (ap) { const p = S.prints.find(x => x.id === (ap.dataset.ap || ap.dataset.rc)); if (ap.dataset.ap) { p.status = 'ok'; S.votos[p.cat][p.id] = 0; } else p.status = 'rec'; render(); return; }
  if (e.target.id === 'abre') { S.aberta = !S.aberta; render(); return; }
  if (e.target.id === 'lib') { S.liberado = !S.liberado; render(); }
});

app.addEventListener('change', e => {
  if (e.target.id !== 'efile' || !e.target.files[0]) return;
  const r = new FileReader();
  const ehVid = e.target.files[0].type.startsWith('video');
  r.onload = () => { arquivo = {d:r.result, vid:ehVid}; document.getElementById('drop').innerHTML = (ehVid ? '<video src="' + arquivo.d + '" muted playsinline style="max-width:200px;display:block;margin:0 auto 10px"></video>' : '<img src="' + arquivo.d + '" alt="Prévia">') + 'Trocar arquivo'; document.getElementById('ebtn').disabled = false; };
  r.readAsDataURL(e.target.files[0]);
});

app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'fenv' && arquivo) { S.prints.push({id:'u' + Date.now(), cat:document.getElementById('ecat').value, status:'pend', [arquivo.vid ? 'vid' : 'img']:arquivo.d}); arquivo = null; aviso('Print enviado.', 'Agora é com a comissão. Se aprovarem, ele entra na votação.', 'inicio'); }
  if (e.target.id === 'flog') { if (document.getElementById('senha').value === SENHA) { S.logado = true; render(); } else document.getElementById('erro').textContent = 'Senha errada.'; }
  if (e.target.id === 'fcat') { const nome = document.getElementById('cnome').value.trim(); if (!nome) return; const id = 'c' + Date.now(); S.cats.push({id, nome, sub:document.getElementById('csub').value.trim(), deco:'', tipo:document.getElementById('ctipo').value}); S.votos[id] = {}; render(); }
});

window.addEventListener('hashchange', render);
render();
}
</script>
</body>
